global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "party-service"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["party-service:8080"]
        labels:
          service: "crm_party_service"
          environment: "production"
