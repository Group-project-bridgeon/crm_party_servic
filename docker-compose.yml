services:
  postgres:
    image: postgres:16
    container_name: party-service-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: party

    ports:
      - "5432:5432"

    volumes:
      - party_postgres_data:/var/lib/postgresql/data

volumes:
  party_postgres_data: